    <script>
        $(window).scroll(function(){

var scrollTop = $(window).scrollTop();
var docHeight = $(document).height() - $(window).height();
var scrollPercent = (scrollTop / docHeight) * 100;

$(".floral-progress").css("width", scrollPercent + "%");

});
    </script>

    <script>
       const flowers = ["🌸","🌺","🌼","💮"];

$(document).on("mousemove",".main-navbar",function(e){

let navbar = $(this);

let offset = navbar.offset();

let x = e.pageX - offset.left;
let y = e.pageY - offset.top;

let randomFlower = flowers[Math.floor(Math.random()*flowers.length)];

let flower = $("<span class='flower-particle'>"+randomFlower+"</span>");

navbar.find(".navbar-flower-container").append(flower);

flower.css({
left:x,
top:y
});

setTimeout(function(){
flower.remove();
},700);

});
    </script>

    <!--jQuery Random Petal Generator-->
    <script>
        $(document).ready(function(){

let flowers = ["🌸","🌺","🌼","🌷"];

for(let i = 0; i < 10; i++){

let petal = $("<span class='petal'></span>");

petal.text(flowers[Math.floor(Math.random()*flowers.length)]);

let left = Math.random() * 10;

let size = Math.random() * 9 + 1;

let duration = Math.random() * 9 + 1;

let delay = Math.random() * 10;

petal.css({
left:left + "%",
fontSize:size + "px",
animationDuration:duration + "s",
animationDelay:delay + "s"
});

$(".falling-petals").append(petal);

}

});
    </script>

    <!--jQuery Flower System-->
    <script>
        $(document).ready(function(){

let flowers = ["🌸","🌺","🌼","🌷"];

/* CREATE PETALS */

function createPetals(layer,count){

for(let i=0;i<count;i++){

let petal = $("<span class='petal'></span>");

petal.text(flowers[Math.floor(Math.random()*flowers.length)]);

petal.css({
left:Math.random()*100 + "%",
fontSize:(Math.random()*20+15)+"px",
animationDuration:(Math.random()*8+6)+"s",
animationDelay:(Math.random()*10)+"s"
});

$(layer).append(petal);

}

}

createPetals(".blur-layer",20);
createPetals(".main-layer",40);
createPetals(".float-layer",15);



/* MOUSE WIND EFFECT */

$(".banner").mousemove(function(e){

let x = e.clientX/50;
let y = e.clientY/50;

$(".petal").css(
"transform",
"translate("+x+"px,"+y+"px)"
);

});



/* PETAL BURST ON CLICK */

$(".banner").click(function(e){

for(let i=0;i<12;i++){

let burst = $("<span class='petal-burst'>🌸</span>");

let x = (Math.random()*200-100)+"px";
let y = (Math.random()*200-100)+"px";

burst.css({
left:e.pageX,
top:e.pageY,
"--x":x,
"--y":y
});

$("body").append(burst);

setTimeout(()=>{
burst.remove();
},1000);

}

});

});
    </script>

    <!--Click Ripple Effect-->

    <script>
        const floweres = ["🌸","🌺","🌼","💮"];

$(document).click(function(e){

let randomFlower = floweres[Math.floor(Math.random()*floweres.length)];

let ripple = $("<span class='flower-ripple'>"+randomFlower+"</span>");

$(".flower-ripple-container").append(ripple);

ripple.css({
left:e.pageX,
top:e.pageY
});

setTimeout(function(){
ripple.remove();
},800);

});
    </script>
    

    <script>
        $(window).on("scroll", function(){

  $(".gal-flower").each(function(){

    let top = $(this).offset().top;
    let scroll = $(window).scrollTop();
    let winH = $(window).height();

    if(scroll + winH - 80 > top){
      $(this).addClass("show");
    }

  });

});
    </script>

    <script>
        $(".gal-flower").mouseenter(function(){

  for(let i=0;i<3;i++){ // low count = no lag

    let petal = $("<span class='gal-petal'>🌸</span>");

    let x = (Math.random()*60 - 30) + "px";
    let y = (Math.random()*-60 - 20) + "px";

    petal.css({
      left: "50%",
      top: "50%",
      "--x": x,
      "--y": y
    });

    $(this).append(petal);

    setTimeout(()=>{
      petal.remove();
    }, 1500);
  }

});
    </script>
